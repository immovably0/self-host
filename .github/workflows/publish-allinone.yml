name: Publish all-in-one image

# Construit l'image tout-en-un, la teste de bout en bout, puis la publie sur GHCR.
# La publication n'a lieu que si le test passe, et seulement sur un push de la
# branche par défaut, sur une étiquette v*, ou à la demande avec publish=true.

on:
  push:
    branches: [main]
    paths:
      - "allinone/**"
      - "database/**"
      - "volumes/**"
      - "assets/**"
      - ".github/workflows/publish-allinone.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "allinone/**"
      - ".github/workflows/publish-allinone.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier l'image sur GHCR après un test réussi"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nuvio-allinone

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax and lint
        run: |
          for f in allinone/nuvio-entrypoint.sh allinone/build.sh allinone/scripts/*.sh; do
            bash -n "$f"
          done
          shellcheck -x allinone/nuvio-entrypoint.sh allinone/build.sh allinone/scripts/*.sh
      - name: Validate Caddyfile
        run: |
          for address in ":8000" "backend.example.com"; do
            docker run --rm \
              -e NUVIO_SITE_ADDRESS="$address" \
              -e NUVIO_PUBLIC_URL=https://backend.example.com \
              -e ANON_KEY=test_anon_key \
              -e SERVICE_ROLE_KEY=test_service_key \
              -v "$GITHUB_WORKSPACE/allinone/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2.10.0 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: Validate Compose example
        run: docker compose -f allinone/docker-compose.yml config --quiet

  build-test-publish:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract upstream image configuration
        run: ./allinone/scripts/extract-image-config.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build test image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: allinone/Dockerfile
          platforms: linux/amd64
          load: true
          tags: nuvio-allinone:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: End-to-end smoke test
        run: ./allinone/scripts/smoke-test.sh nuvio-allinone:ci

      - name: Decide whether to publish
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.gate.outputs.publish == 'true'

      - uses: docker/login-action@v3
        if: steps.gate.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        if: steps.gate.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Publish (amd64 + arm64)
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: allinone/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
